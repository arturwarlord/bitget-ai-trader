name: Bitget Donchian 1h EMA200 Confirmation Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitget-donchian-htf-experiment
  cancel-in-progress: false

jobs:
  experiment:
    name: Read-only BTCUSDT 5m breakout with 1h confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run read-only higher-timeframe experiment
        run: python donchian_htf_experiment.py
      - name: Save experiment report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-donchian-htf-report
          path: donchian-htf-report.json
          if-no-files-found: error
          retention-days: 14
