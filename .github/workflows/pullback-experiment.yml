name: Bitget 15m Trend Pullback Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitget-15m-pullback-experiment
  cancel-in-progress: false

jobs:
  experiment:
    name: Read-only BTCUSDT 15m pullback backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only pullback experiment
        run: python pullback_experiment.py

      - name: Save experiment report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-pullback-report
          path: pullback-report.json
          if-no-files-found: error
          retention-days: 14
