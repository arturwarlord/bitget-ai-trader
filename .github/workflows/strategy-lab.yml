name: Bitget Strategy Lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitget-strategy-lab
  cancel-in-progress: false

jobs:
  strategy-lab:
    name: Compare strategy parameters (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only strategy lab
        run: python strategy_lab.py

      - name: Save strategy lab report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-strategy-lab-report
          path: strategy-lab-report.json
          if-no-files-found: error
          retention-days: 14
