name: Bitget Multi-Asset Strategy Research

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 0"
  pull_request:
    paths:
      - "market_universe_lab.py"
      - "cost_stress_test.py"
      - "walk_forward_validation.py"
      - "cross_asset_breakout_lab.py"
      - "tests/test_market_universe_lab.py"
      - "tests/test_cost_stress_test.py"
      - "tests/test_walk_forward_validation.py"
      - "tests/test_cross_asset_breakout_lab.py"
      - "docs/index.html"
      - ".github/workflows/market-universe-research.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bitget-multi-asset-research
  cancel-in-progress: false

jobs:
  research:
    name: Compare USDT futures and timeframes (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Research multiple assets and timeframes
        run: python market_universe_lab.py
      - name: Stress test shortlist against higher costs
        run: python cost_stress_test.py
      - name: Validate with rolling walk-forward windows
        run: python walk_forward_validation.py
      - name: Validate fixed Donchian breakout across assets and timeframes
        run: python cross_asset_breakout_lab.py
      - name: Save latest reports for the dashboard
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/data
          cp market-universe-report.json docs/data/latest-report.json
          cp cost-stress-report.json docs/data/cost-stress-report.json
          cp walk-forward-report.json docs/data/walk-forward-report.json
          if ! git diff --quiet -- docs/data/latest-report.json docs/data/cost-stress-report.json docs/data/walk-forward-report.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/latest-report.json docs/data/cost-stress-report.json docs/data/walk-forward-report.json
            git commit -m "Update strategy research, cost stress and walk-forward reports"
            git push
          fi
      - name: Upload research report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitget-multi-asset-strategy-report
          path: market-universe-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload cost stress report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitget-cost-stress-report
          path: cost-stress-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload walk-forward report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitget-walk-forward-report
          path: walk-forward-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload cross-asset breakout walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-cross-asset-breakout-report
          path: cross-asset-breakout-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload dashboard site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
