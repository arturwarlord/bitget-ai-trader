name: Bitget Funding-Aware Cross-Asset Research

on:
  pull_request:
    paths:
      - "funding_rate_lab.py"
      - "funding_aware_cross_asset_lab.py"
      - "tests/test_funding_rate_lab.py"
      - "tests/test_backtest.py"
      - "backtest.py"
      - "volume_breakout_lab.py"
      - "dmi_adx_lab.py"
      - "volatility_squeeze_lab.py"
      - "cross_asset_breakout_lab.py"
      - "market_universe_lab.py"
      - ".github/workflows/funding-aware-cross-asset.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitget-funding-aware-cross-asset-research
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'research/funding-aware-cross-asset'
    name: Re-evaluate fixed strategies with settled funding (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run funding-aware cross-asset walk-forward
        run: python funding_aware_cross_asset_lab.py
      - name: Upload funding-aware report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-funding-aware-cross-asset-report
          path: funding-aware-cross-asset-report.json
          if-no-files-found: error
          retention-days: 30
