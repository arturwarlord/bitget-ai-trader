name: Bitget Walk-Forward Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/mean-reversion-bollinger-adx
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bitget-walk-forward-validation
  cancel-in-progress: false

jobs:
  walk-forward:
    name: Compare fixed strategies across chronological folds (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run EMA walk-forward validation
        run: python walk_forward.py

      - name: Compare EMA, Donchian, pullback, ADX breakout and Bollinger mean reversion
        run: python strategy_comparison.py

      - name: Save EMA walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-walk-forward-report
          path: walk-forward-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Save cross-strategy comparison report
        uses: actions/upload-artifact@v4
        with:
          name: bitget-strategy-comparison-report
          path: strategy-comparison-report.json
          if-no-files-found: error
          retention-days: 14
